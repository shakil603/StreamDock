name: Build StreamDock APK
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pinned SDK packages
        run: sdkmanager "platforms;android-35" "platforms;android-28" "build-tools;35.0.0"
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon newpipe-extractor:test testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Verify Android 9 URL codec compatibility in APK
        run: python3 tools/verify_url_codec_dex.py app/build/outputs/apk/debug/app-debug.apk
      - name: Verify packaged FFmpeg runtime dependencies for every ABI
        run: python3 tools/verify_ffmpeg_runtime.py app/build/outputs/apk/debug/app-debug.apk
      - name: Verify release boundaries (TeraBox engine + browser)
        run: python3 tools/verify_browser_release.py app/build/outputs/apk/debug/app-debug.apk
      - name: Upload universal debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamDock-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            newpipe-extractor/build/reports/
          if-no-files-found: ignore
          retention-days: 7
