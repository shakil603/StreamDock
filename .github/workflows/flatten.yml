name: Bring Files to Root

on:
  push:
    branches:
      - main

jobs:
  move-up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move all files from StreamDock/StreamDock to root
        run: |
          # যদি ভেতরের ফোল্ডারটি থাকে, তবে তার ভেতরের সব কন্টেন্ট রুটে নিয়ে আসুন
          if [ -d "StreamDock/StreamDock" ]; then
            shopt -s dotglob
            mv StreamDock/StreamDock/* ./
            rm -rf StreamDock
            shopt -u dotglob
          elif [ -d "StreamDock" ]; then
            shopt -s dotglob
            mv StreamDock/* ./
            rmdir StreamDock
            shopt -u dotglob
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
            commit_message: "Bring all project files to root directory"
            branch: main
