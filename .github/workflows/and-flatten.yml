name: Flatten Project Structure

on:
  push:
    branches:
      - main

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move files from StreamDock folder to root
        run: |
          # যদি StreamDock ফোল্ডারটি থাকে, তবে তার ভেতরের সব ফাইল রুট ডিরেক্টরিতে সরিয়ে নিন
          if [ -d "StreamDock" ]; then
            shopt -s dotglob
            mv StreamDock/* ./
            rmdir StreamDock
            shopt -u dotglob
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-flatten project files to root directory"
          branch: main
