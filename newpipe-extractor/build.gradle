plugins { id 'java-library' }

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

dependencies {
    implementation 'com.github.TeamNewPipe:nanojson:e9d656ddb49a412a5a0a5d5ef20ca7ef09549996'
    implementation 'org.jsoup:jsoup:1.22.2'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.protobuf:protobuf-javalite:4.35.1'
    implementation 'org.mozilla:rhino:1.8.1'
    implementation 'org.mozilla:rhino-engine:1.8.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.ow2.asm:asm:9.7.1'
}

test {
    def localProps = new Properties()
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) propsFile.withInputStream { localProps.load(it) }
    def sdk = providers.environmentVariable('ANDROID_HOME').orNull ?: providers.environmentVariable('ANDROID_SDK_ROOT').orNull ?: localProps.getProperty('sdk.dir', '')
    systemProperty 'android28.jar', new File(sdk, 'platforms/android-28/android.jar').absolutePath
    testLogging { events 'failed', 'skipped' }
}
